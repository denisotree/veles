name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy (strict tier)
        run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Install bubblewrap (Linux sandbox)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; a profile
        # for bwrap lifts it for bwrap alone (what a user does to enable the sandbox).
        run: |
          sudo apt-get install -y -qq bubblewrap
          if ! bwrap --dev-bind / / -- true 2>/dev/null; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          if bwrap --dev-bind / / -- true; then echo "BWRAP_OK"; else echo "BWRAP_UNAVAILABLE"; fi
      - name: Run tests
        run: uv run pytest -q
