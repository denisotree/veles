# Admin-tier policy for the delegated gemini CLI (`--admin-policy`): it runs
# Veles' own tools only. Veles gates those itself (trust ladder, sandbox);
# gemini's built-in shell, file and web tools — which would bypass that — are
# denied. Admin tier outranks workspace/user policies and approval modes.

[[rule]]
mcpName = "veles"
toolName = "*"
decision = "allow"
priority = 900

[[rule]]
toolName = "*"
decision = "deny"
priority = 100
